<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PictoComunica Pro — Portada</title>
  <meta name="theme-color" content="#2563eb"/>
  <link rel="manifest" href="manifest.webmanifest"/>

  <style>
    :root{
      --bg:#ffffff; --card:#ffffff; --text:#0b1220; --muted:#475569;
      --primary:#2563eb; --accent:#10b981; --border:#e2e8f0; --focus:#93c5fd;
      --rail:180px; --gap:10px;
      --topbar-h:64px;   /* alto aprox del header en desktop */
      --actions-h:0px;   /* en desktop no hay segunda fila */
      /* EDIT: ancho del drawer de secciones */
      --drawer-w: clamp(180px, 24vw, 240px);
    }
    [data-theme="dark"]{
      --bg:#0f172a; --card:#0b1220; --text:#f8fafc; --muted:#cbd5e1;
      --primary:#60a5fa; --accent:#22c55e; --border:#1f2937; --focus:#60a5fa;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial; overflow-x:hidden}

    /* ================= Topbar ================= */
    .topbar{
      position:fixed; inset:0 0 auto 0;
      z-index:100; background:linear-gradient(90deg,var(--primary),#1e3a8a);
      color:#fff; box-shadow:0 2px 8px rgb(0 0 0/12%);
    }
    .toprow{
      max-width:1400px; margin:0 auto; width:100%;
      padding:8px 12px; display:flex; align-items:center; gap:10px;
      min-height:var(--topbar-h);
    }
    .brand{display:flex; gap:10px; align-items:center; font-weight:900; min-width:0}
    .logo{width:36px;height:36px;border-radius:10px;background:#fff;color:#1e3a8a;display:grid;place-items:center;font-weight:900}
    .topbtn{
      border:none;border-radius:10px;background:rgb(255 255 255 / 14%);
      padding:10px 14px; color:#fff; font-weight:800; cursor:pointer; white-space:nowrap
    }
    .topbtn.primary{background:rgb(255 255 255 / 18%)}
    .topbtn.success{background:#16a34a}
    .topbtn.warn{background:#f59e0b; color:#111}
    .topbtn.info{background:#0ea5e9}
    .spacer{flex:1}

    /* Acciones: en DESKTOP van en la MISMA fila a la derecha */
    .actions{
      display:flex; gap:8px; align-items:center;
    }
    .actions .topbtn{min-width:112px}

    /* ================= Layout base ================= */
    .layout{
      max-width:1400px;
      margin: calc(var(--topbar-h) + var(--actions-h) + 10px) auto 14px;
      padding: 0 10px; display:grid;
      /* EDIT: el contenido ocupa todo el ancho; el sidebar pasa a drawer */
      grid-template-columns: 1fr;
      gap:var(--gap);
    }
    .layout > * { min-width:0; }

    /* Sidebar (EDIT: drawer fijo lateral en TODAS las pantallas) */
    .sidebar{
      position:fixed; left:0;
      top:calc(var(--topbar-h) + var(--actions-h)); bottom:0;
      width:var(--drawer-w);
      transform:translateX(-100%); transition:transform .25s ease;
      background:var(--card); border-right:1px solid var(--border);
      box-shadow:2px 0 18px rgb(0 0 0/18%); border-radius:0 12px 12px 0; z-index:101;
      padding:8px; overflow:auto; max-height:calc(100vh - (var(--topbar-h) + var(--actions-h)));
    }
    .sidebar.open{ transform:translateX(0) }

    .sectionTitle{margin:6px 0 8px; color:var(--muted); font-weight:900; font-size:12px; letter-spacing:.3px}
    .seclist{display:flex; flex-direction:column; gap:8px}
    .chip{
      width:100%; display:grid; grid-template-columns:28px 1fr; gap:8px; align-items:center;
      padding:10px 12px; border-radius:12px; border:1px solid var(--border); background:var(--card);
      cursor:pointer; font-weight:900; font-size:13px; transition:transform .06s ease;
      text-decoration:none; color:inherit;
    }
    .chip:hover{ transform:translateY(-1px) }
    .chip .ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px}

    /* Main */
    .main{min-height:60vh; min-width:0}
    .grid{ display:grid; gap:8px }

    /* ====== GRID: 12 / 10 / 5 / 4 por fila ====== */
    #panelGrid{ grid-template-columns: repeat(12, minmax(0, 1fr)); }              /* Desktop */
    @media (max-width:1200px){ #panelGrid{ grid-template-columns: repeat(12, minmax(0, 1fr)); } } /* Tablet */
    @media (max-width:768px){  #panelGrid{ grid-template-columns: repeat(8,  minmax(0, 1fr)); } } /* Celular */
    @media (max-width:420px){  #panelGrid{ grid-template-columns: repeat(5,  minmax(0, 1fr)); } } /* Celular chico */

   
   
    .card{ background:var(--card); border:0px solid var(--border); border-radius:10px; min-height:96px; padding:2px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; }
     .card:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgb(0 0 0 / 10%); }

 
  .picto{ width:96px; height:96px; border-radius:8px; background:#fff; border:1px solid var(--border); display:grid; place-items:center; overflow:hidden }
    @media (max-width:1200px){ .picto{ width:74px; height:74px } }   /* tablet */
    @media (max-width:768px){  .picto{ width:68px; height:68px } }   /* cel */
    @media (max-width:420px){  .picto{ width:62px; height:62px } }   /* cel chico */

    .picto img{ width:100%; height:100%; object-fit:contain }
    .lbl{ font-size:11px; line-height:1.1; font-weight:800; color:var(--text) }
    @media (max-width:768px){ .lbl{ font-size:10px } }
    @media (max-width:420px){ .lbl{ font-size:9px } }

    /* Botón eliminar para personalizados */
    .delbtn{ position:absolute; top:6px; right:6px; border:none; background:#ef4444; color:#fff; font-weight:900; border-radius:50%; width:22px; height:22px; line-height:22px; text-align:center; padding:0; cursor:pointer; font-size:14px; box-shadow:0 2px 6px rgb(0 0 0 / 15%); display:none; }
    .card.custom .delbtn{ display:block; }

    /* Frase */
    .phrase{ display:flex; flex-wrap:wrap; gap:6px; min-height:46px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:8px; margin:8px 0 14px; }
    .piece{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:999px; padding:6px 10px; font-weight:800; background:#f8fafc; }
    .piece img{ width:32px; height:32px; border-radius:8px; object-fit:cover }
    .x{ border:0; background:transparent; cursor:pointer; opacity:.6; font-weight:900 }
    .x:hover{ opacity:1 }

    /* Colores pictos */
    .picto.bg-blue-pastel   { background-color:#7ec1e4; }
    .picto.bg-yellow-light  { background-image:linear-gradient(45deg,#FFD93D,#FFB347); }
    .picto.bg-light-green   { background-color:#72cf44; }
    .picto.bg-orange        { background-color:#f6ba85; }
    .picto.bg-mint          { background-color:#ff3c23db; }
    .picto.bg-light-purple  { background-color:#e47474; }
    .picto.btn-dont-want    { background-color:#f0f0f0; }

    /* Drawer */
    .drawer{ position:fixed; right:0; width:320px; top:calc(var(--topbar-h) + var(--actions-h)); height:calc(100% - (var(--topbar-h) + var(--actions-h))); background:var(--card); border-left:1px solid var(--border); box-shadow:-6px 0 24px rgb(0 0 0 / 10%); transform:translateX(100%); transition:transform .25s ease; z-index:999; display:flex; flex-direction:column; }
    .drawer.open{ transform:translateX(0) }
    .drawer h3{ margin:12px; font-size:16px }
    .drawer .content{ padding:0 12px 12px; overflow:auto; display:grid; gap:10px }
    .ctrl label{ display:block; font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:700 }
    .ctrl input[type="range"], .ctrl select{ width:100%; }
    .radio-row{ display:flex; flex-wrap:wrap; gap:8px }
    .radio-row label{ display:flex; align-items:center; gap:6px; padding:6px 8px; border:1px solid var(--border); border-radius:999px; cursor:pointer; font-size:12px; font-weight:700 }
    .drawer .foot{ margin-top:auto; padding:10px 12px; border-top:1px solid var(--border); display:flex; gap:8px }
    .btn{ border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:10px; padding:8px 10px; font-weight:800; cursor:pointer }
    .btn.primary{ background:var(--primary); color:#fff; border-color:var(--primary) }
    .btn.ghost{ background:transparent }

    /* Toggles laterales (EDIT: botón izquierdo SIEMPRE visible) */
    .toggle{ position:fixed; top:15%; transform:translateY(-50%); z-index:1001; background:var(--primary); color:#fff; border:none; border-radius:10px 0 0 10px; width:30px; height:40px; cursor:pointer; box-shadow:-2px 2px 10px rgb(0 0 0 / 18%); font-size:16px; font-weight:900; }
    .toggle.right{ right: max(6px, env(safe-area-inset-right)) }
    .toggle.left{ left:  max(6px, env(safe-area-inset-left)); border-radius:0 10px 10px 0; display:block } /* EDIT */

    /* ============ MÓVIL ============ */
    @media (max-width:768px){
      :root{ --rail:100%; --actions-h:52px; }      /* hay segunda fila visible */
      .layout{ grid-template-columns:1fr }
      /* (sidebar ya es drawer global; mantenemos botón izquierdo visible) */

      /* Header móvil */
      .toprow{ padding:6px 8px; gap:6px; flex-wrap:wrap }
      .logo{ width:30px; height:30px }
      .topbtn{ padding:8px 10px; font-size:12px }

      .actions{
        width:100%;
        justify-content:center;
        gap:6px;
        padding:6px 8px 8px;
        border-top:1px solid rgb(255 255 255 / 16%);
      }
    }

    /* Toast */
    .toast{ position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 14px; border-radius:10px; font-weight:800; z-index:1100; display:none; }
    .toast.show{ display:block; animation:fade 2.0s ease forwards }
    @keyframes fade{ 0%{opacity:0; transform:translateX(-50%) translateY(8px)} 10%{opacity:1; transform:translateX(-50%)} 90%{opacity:1} 100%{opacity:0} }
  </style>
</head>
<body>

  <!-- TOPBAR -->
  <div class="topbar" role="banner">
    <div class="toprow">
      <div class="brand"><div class="logo">PC</div> PictoComunica</div>

      <button class="topbtn primary" id="playBtn">▶ Reproducir</button>
      <button class="topbtn" id="clearBtn">🗑 Borrar</button>

      <div class="spacer"></div>

      <!-- MISMA FILA (derecha) en desktop / se hace segunda fila en móvil -->
      <div class="actions">
        <button class="topbtn warn" id="addBtn">➕ Agregar</button>
       
        <button class="topbtn success" id="installBtn" title="Instalar la aplicación" hidden>Instalar</button>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>
    </div>
  </div>

  <!-- LAYOUT -->
  <div class="layout" role="main">
    <!-- SIDEBAR -->
    <aside class="sidebar" aria-label="Secciones" id="sidebar">
      <div class="sectionTitle">Secciones</div>
      <div class="seclist" id="secList">
        <a class="chip" href="index.html"><div class="ico">🏠</div> Panel</a>
        <a class="chip" href="yoquiero.html"><div class="ico">❤️</div> Yo quiero</a>
        <a class="chip" href="rutina.html"><div class="ico">🗓️</div> Rutinas</a>
        <a class="chip" href="numeros.html"><div class="ico">🔢</div> Números</a>
        <a class="chip" href="letras.html"><div class="ico">🔤</div> Letras</a>
        <a class="chip" href="familia.html"><div class="ico">👨‍👩‍👧</div> Familia</a>
        <a class="chip" href="autoreg.html"><div class="ico">🧘</div> Autorregulación</a>
        <a class="chip" href="juego.html"><div class="ico">🎮</div> Juego</a>
        <a class="chip" href="TuPanel.html"><div class="ico">⭐</div> Tu Panel</a>
      </div>
    </aside>

    <!-- CONTENIDO -->
    <section class="main">
      <div id="phraseBar" class="phrase" aria-live="polite"></div>
      <div class="grid" id="panelGrid" aria-label="Panel principal"></div>
    </section>
  </div>

  <!-- Toggles laterales -->
  <button class="toggle left"  id="leftToggle"  aria-controls="sidebar"      aria-expanded="false" title="Abrir secciones">❯</button>
  <button class="toggle right" id="rightToggle" aria-controls="configDrawer" aria-expanded="false" title="Abrir configuración">❮</button>

  <!-- Drawer Config -->
  <aside id="configDrawer" class="drawer" aria-label="Configuración">
    <h3>⚙️ Configuración</h3>
    <div class="content">
      <div class="ctrl">
        <label for="voiceSelect">Voz / Idioma</label>
        <select id="voiceSelect"></select>
      </div>
      <div class="ctrl">
        <label for="rate">Velocidad</label>
        <input id="rate" type="range" min="0.4" max="1.2" step="0.05" value="0.9">
      </div>
      <div class="ctrl">
        <label for="pitch">Tono</label>
        <input id="pitch" type="range" min="0.8" max="1.2" step="0.05" value="1">
      </div>
      <div class="ctrl">
        <label for="volume">Volumen</label>
        <input id="volume" type="range" min="0.1" max="1" step="0.05" value="1">
      </div>
      <div class="ctrl">
        <label>Tema</label>
        <div class="radio-row" id="themeRow">
          <label><input type="radio" name="theme" value="light" checked> Claro</label>
          <label><input type="radio" name="theme" value="dark"> Oscuro</label>
          <label><input type="radio" name="theme" value="contrast"> Alto contraste</label>
          <label><input type="radio" name="theme" value="pastel"> Pastel</label>
        </div>
      </div>
    </div>
    <div class="foot">
      <button class="btn ghost" id="resetBtn">Restablecer</button>
      <button class="btn primary" id="closeDrawer">Listo</button>
    </div>
  </aside>

  

  <!-- Toast -->
  <div class="toast" id="toast">Guardado ✅</div>

  <script>
    /* ===== Service Worker (opcional) ===== */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', ()=> navigator.serviceWorker.register('./sw.js', {scope: './'}));
    }

    /* ===== Helpers ===== */
    const $ = (q,root=document)=> root.querySelector(q);
    const $$= (q,root=document)=> Array.from(root.querySelectorAll(q));
    const toast = $('#toast');
    const sidebar   = $('#sidebar');
    const drawer    = $('#configDrawer');
    const leftToggle= $('#leftToggle');
    const rightToggle=$('#rightToggle');
    const closeDrawer=$('#closeDrawer');
    const secList   = $('#secList');
    function showToast(msg){ toast.textContent = msg || 'Listo'; toast.classList.add('show'); setTimeout(()=> toast.classList.remove('show'), 2000); }

    /* ===== Toggle con lock para evitar parpadeo ===== */
    let tLock=false; const lock=(fn)=>{ if(tLock) return; tLock=true; fn(); setTimeout(()=>tLock=false,280); };
    leftToggle?.addEventListener('click', e=> lock(()=>{ const o=!sidebar.classList.contains('open'); sidebar.classList.toggle('open',o); leftToggle.setAttribute('aria-expanded',String(o)); }));
    rightToggle?.addEventListener('click',e=> lock(()=>{ const o=!drawer.classList.contains('open'); drawer.classList.toggle('open',o); rightToggle.setAttribute('aria-expanded',String(o)); }));
    /* EDIT: al cerrar el drawer, también cerramos el menú de secciones (si estuviera abierto) */
    closeDrawer?.addEventListener('click', ()=>{
      drawer.classList.remove('open');
      rightToggle.setAttribute('aria-expanded','false');
      sidebar.classList.remove('open');            /* EDIT */
      leftToggle.setAttribute('aria-expanded','false'); /* EDIT */
    });
    /* EDIT: al navegar por una sección, cerramos el menú SIEMPRE (antes solo en móvil) */
    secList?.addEventListener('click', (ev)=>{
      const link = ev.target.closest('a.chip'); if(!link) return;
      sidebar.classList.remove('open');                 /* EDIT */
      leftToggle.setAttribute('aria-expanded','false'); /* EDIT */
    });

    /* ===== PWA install ===== */
    const installBtn = $('#installBtn'); let deferredPrompt=null;
    window.addEventListener('beforeinstallprompt', (e)=>{ e.preventDefault(); deferredPrompt=e; installBtn.hidden=false; });
    const isStandalone=()=> window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
    if(isStandalone()) installBtn.hidden=true;
    installBtn?.addEventListener('click', async ()=>{ if(!deferredPrompt) return; installBtn.disabled=true; try{ const choice=await deferredPrompt.prompt(); const outcome=deferredPrompt.userChoice?(await deferredPrompt.userChoice).outcome:(choice?.outcome||''); if(outcome==='accepted') installBtn.hidden=true; else installBtn.disabled=false; deferredPrompt=null; }catch{ installBtn.disabled=false; }});
    window.addEventListener('appinstalled', ()=>{ installBtn.hidden=true; deferredPrompt=null; });

    /* ===== Voz ===== */
    (function(){
      const voiceSelect = $('#voiceSelect');
      const rateEl   = $('#rate'), pitchEl = $('#pitch'), volEl = $('#volume'), themeRow = $('#themeRow');
      const store = { get k(){ return JSON.parse(localStorage.getItem('pc_speech')||'{}'); }, set(obj){ localStorage.setItem('pc_speech', JSON.stringify(Object.assign(this.k,obj))); } };
      const SpeechEngine = {
        voices: [], opts: { voiceURI: store.k.voiceURI || null, rate:parseFloat(store.k.rate ?? rateEl?.value ?? 0.9)||0.9, pitch:parseFloat(store.k.pitch ?? pitchEl?.value ?? 1)||1, volume:parseFloat(store.k.volume ?? volEl?.value ?? 1)||1 },
        refreshVoices(){
          if(!('speechSynthesis' in window)) return;
          const raw = window.speechSynthesis.getVoices();
          const es = raw.filter(v=>/^es[-_]/i.test(v.lang));
          const rest = raw.filter(v=>!/^es[-_]/i.test(v.lang));
          const seen=new Set();
          this.voices=[...es,...rest].filter(v=>{ if(seen.has(v.voiceURI)) return false; seen.add(v.voiceURI); return true; });
          if(voiceSelect){
            voiceSelect.innerHTML = this.voices.map(v=>`<option value="${v.voiceURI}">${v.name} (${v.lang})</option>`).join('');
            const want = (this.voices.find(v=>v.voiceURI===this.opts.voiceURI)?.voiceURI) || (es[0]?.voiceURI || this.voices[0]?.voiceURI || '');
            voiceSelect.value=want; this.opts.voiceURI=want; store.set({voiceURI:want});
          }
        },
        speak(t){
          if(!('speechSynthesis' in window) || !t) return;
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(t);
          const v = this.voices.find(x=>x.voiceURI===this.opts.voiceURI);
          if(v){ u.voice=v; u.lang=v.lang; } else { u.lang='es-AR'; }
          u.rate=this.opts.rate; u.pitch=this.opts.pitch; u.volume=this.opts.volume;
          speechSynthesis.speak(u);
        }
      };
      window.speak = (t)=> SpeechEngine.speak(t);
      function clamp(n,min,max){ n=parseFloat(n); return Math.min(max, Math.max(min, n)); }
      const preview=(m)=>{ if(!drawer.classList.contains('open')) return; clearTimeout(preview.t); preview.t=setTimeout(()=>SpeechEngine.speak(m||'Ajuste de voz'),250); }

      rateEl?.addEventListener('input', ()=>{ SpeechEngine.opts.rate=clamp(rateEl.value,0.4,1.2); store.set({rate:SpeechEngine.opts.rate}); preview('Velocidad'); });
      pitchEl?.addEventListener('input',()=>{ SpeechEngine.opts.pitch=clamp(pitchEl.value,0.8,1.2); store.set({pitch:SpeechEngine.opts.pitch}); preview('Tono'); });
      volEl?.addEventListener('input',  ()=>{ SpeechEngine.opts.volume=clamp(volEl.value,0.1,1.0); store.set({volume:SpeechEngine.opts.volume}); preview('Volumen'); });
      voiceSelect?.addEventListener('change', ()=>{ SpeechEngine.opts.voiceURI=voiceSelect.value; store.set({voiceURI:voiceSelect.value}); preview('Voz'); });

      if('speechSynthesis' in window){ SpeechEngine.refreshVoices(); speechSynthesis.onvoiceschanged=()=>SpeechEngine.refreshVoices(); }

      /* Reproducir / Limpiar frase */
      $('#playBtn')?.addEventListener('click', ()=>{ const txt = Array.from($('#phraseBar')?.querySelectorAll('strong')||[]).map(n=>n.textContent.trim()).join(' '); SpeechEngine.speak(txt || 'Hola'); });
      $('#clearBtn')?.addEventListener('click', ()=>{ const pb=$('#phraseBar'); if(pb) pb.textContent=''; });

      /* Tema */
      const savedTheme = localStorage.getItem('pc_theme');
      if(savedTheme){ document.documentElement.setAttribute('data-theme', savedTheme); const radio = themeRow?.querySelector(`input[value="${savedTheme}"]`); if(radio) radio.checked = true; }
      themeRow?.addEventListener('change', (e)=>{ const v = e.target.value; document.documentElement.setAttribute('data-theme', v); localStorage.setItem('pc_theme', v); });

      $('#resetBtn')?.addEventListener('click', ()=>{ rateEl.value='0.9'; pitchEl.value='1'; volEl.value='1'; SpeechEngine.opts.rate=0.9; SpeechEngine.opts.pitch=1; SpeechEngine.opts.volume=1; store.set({rate:0.9,pitch:1,volume:1}); preview('Restablecer'); showToast('Configuración restablecida'); });
    })();

    /* ===== Panel base + personalizados (con eliminar) ===== */
    const panelGrid = $('#panelGrid');
    const phraseBar = $('#phraseBar');
    const LS_PICTOS = 'pc_custom_pictos';
    const LS_FAVS   = 'pc_favs';

    const basePictos = [
      {word:'hola',img:'./imagenes/portada/hola.png',cls:'bg-orange'},
      {word:'chau',img:'./imagenes/portada/chau.png',cls:'bg-orange'},
      {word:'yo',img:'./imagenes/portada/yo.png',cls:'bg-light-green'},
      {word:'estoy',img:'./imagenes/portada/estar.png',cls:'bg-yellow-light'},
      {word:'feliz',img:'./imagenes/sentimientos/contento.png',cls:'bg-blue-pastel'},
      {word:'enojado',img:'./imagenes/sentimientos/enfado.png',cls:'bg-blue-pastel'},
      {word:'bien',img:'./imagenes/portada/bien.png',cls:'bg-light-green'},
      {word:'mal',img:'./imagenes/portada/mal.png',cls:'bg-mint'},
      {word:'gracias',img:'./imagenes/portada/gracias.png',cls:'bg-blue-pastel'},
      {word:'agua',img:'./imagenes/portada/bebidas.png',cls:'bg-light-purple'},
      {word:'comida',img:'./imagenes/portada/alimentos.png',cls:'bg-light-purple'},
      {word:'ir al baño',img:'./imagenes/rutinas/bano.png',cls:'bg-yellow-light'},
      {word:'tengo',img:'./imagenes/portada/tener.png',cls:'bg-yellow-light'},
      {word:'ir',img:'./imagenes/portada/ir.png',cls:'bg-yellow-light'},
      {word:'jugar',img:'./imagenes/rutinas/jugar a la pelota.png',cls:'bg-yellow-light'},
      {word:'¿cómo estás?',img:'./imagenes/portada/comoestas.png',cls:'bg-blue-pastel'},
      {word:'casa',img:'./imagenes/portada/casa.png',cls:'bg-light-purple'},
      {word:'escuela',img:'./imagenes/portada/escuela.png',cls:'bg-light-purple'},
      {word:'te amo',img:'./imagenes/portada/amar.png',cls:'bg-blue-pastel'},
      {word:'SÍ',img:'./imagenes/portada/si.png',cls:'btn-dont-want'},
      {word:'NO',img:'./imagenes/portada/no.png',cls:'btn-dont-want'},
      {word:'ME GUSTA',img:'./imagenes/portada/megusta.png',cls:'bg-blue-pastel'},
      {word:'NO ME GUSTA',img:'./imagenes/portada/nomegusta.png',cls:'bg-blue-pastel'},
      {word:'QUIERO',img:'./imagenes/portada/quiero.png',cls:'bg-yellow-light'}
    ];

    const piece=(text,img)=>{
      const span=document.createElement('span'); span.className='piece';
      if(img){ const im=document.createElement('img'); im.src=img; im.alt=text; span.appendChild(im); }
      const b=document.createElement('strong'); b.textContent=text.toUpperCase();
      const x=document.createElement('button'); x.className='x'; x.title='Quitar'; x.textContent='✕';
      x.addEventListener('click',()=> span.remove());
      span.appendChild(b); span.appendChild(x);
      return span;
    };

    function card({word,img,cls,custom}){
      const el=document.createElement('div'); el.className='card'+(custom?' custom':'');
      const pict=document.createElement('div'); pict.className=`picto ${cls||''}`;
      const im=document.createElement('img'); im.src=img; im.alt=word; pict.appendChild(im);
      const lbl=document.createElement('div'); lbl.className='lbl'; lbl.textContent=word.toUpperCase();

      el.addEventListener('click',(ev)=>{ if(ev.target.classList.contains('delbtn')) return; phraseBar.appendChild(piece(word,img)); if(typeof window.speak==='function') window.speak(word); });

      if(custom){
        const del=document.createElement('button'); del.className='delbtn'; del.textContent='×'; del.title='Eliminar pictograma';
        del.addEventListener('click',(e)=>{ e.stopPropagation(); if(confirm(`¿Eliminar el pictograma "${word}"?`)){ const list=loadCustom(); const idx=list.findIndex(p=>p.word.toLowerCase()===word.toLowerCase()); if(idx>=0){ list.splice(idx,1); saveCustom(list); renderAll(); showToast('Pictograma eliminado'); } }});
        el.appendChild(del);
      }
      el.appendChild(pict); el.appendChild(lbl);
      return el;
    }

    const loadCustom=()=>{ try{ return JSON.parse(localStorage.getItem(LS_PICTOS)||'[]'); }catch{ return []; } };
    const saveCustom=(list)=> localStorage.setItem(LS_PICTOS, JSON.stringify(list||[]));

    function renderAll(){
      panelGrid.innerHTML='';
      basePictos.forEach(p=> panelGrid.appendChild(card(p)));
      loadCustom().forEach(p=> panelGrid.appendChild(card({...p,custom:true})));
    }

    /* Agregar personalizados */
    const addBtn=$('#addBtn'), fileIn=$('#fileInput');
    addBtn?.addEventListener('click',()=> fileIn.click());
    fileIn?.addEventListener('change',(ev)=>{
      const f=ev.target.files?.[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload=(e)=>{
        const src=e.target.result; let word=prompt('Ingrese la palabra para el pictograma:');
        if(!word || !word.trim()){ fileIn.value=''; return; } word=word.trim();
        const cls=prompt('Clase de color (opcional: bg-yellow-light, bg-blue-pastel, etc.):','bg-orange') || 'bg-orange';
        const list=loadCustom(); const i=list.findIndex(p=>p.word.toLowerCase()===word.toLowerCase());
        const entry={word,img:src,cls}; if(i>=0) list[i]=entry; else list.push(entry);
        saveCustom(list); renderAll(); showToast('Pictograma agregado'); fileIn.value='';
      };
      rd.readAsDataURL(f);
    });

    /* Guardar frase */
    const saveBtn=$('#saveBtn');
    saveBtn?.addEventListener('click',()=>{
      const text=Array.from(phraseBar.querySelectorAll('strong')).map(n=>n.textContent.trim()).join(' ');
      const favs=JSON.parse(localStorage.getItem(LS_FAVS)||'[]');
      if(text){ favs.push({text,ts:Date.now()}); localStorage.setItem(LS_FAVS, JSON.stringify(favs)); }
      showToast(text ? 'Frase guardada' : 'Nada para guardar');
    });

    document.addEventListener('DOMContentLoaded', renderAll);

    /* Modal genérico */
    const modal=$('#modal'); const modalClose=$('#modalClose');
    modalClose?.addEventListener('click',()=> modal.classList.remove('open'));
    modal?.addEventListener('click',(e)=>{ if(e.target===modal) modal.classList.remove('open'); });
  </script>
</body>
</html>
